name: "build-and-push-slim-devcontainer-all-vers"
on: # rebuild when devcontainer is updated
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/build-slim-all-vers.yaml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      ghidra_versions:
        description: 'JSON list of Ghidra versions to build (default: full matrix)'
        required: false
        default: '["12.2"]'
      python_versions:
        description: 'JSON list of Python versions to build (default: full matrix)'
        required: false
        default: '["3.13", "3.12", "3.11", "3.10"]'

jobs:
  build-slim-all-vers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # platform: [linux/amd64,linux/arm64]
        # pyhidra min Ghidra version 10.1.1
        #ghidra-ver: ['11.4','11.3.2', '11.2.1', '11.1.2', '10.4', '10.3.3', '10.2.3', '10.1.5']
        #ghidra-ver: ['12.0', '11.4.3', '11.3.2', '11.2.1', '11.1.2', '10.4']
        ghidra-ver: ${{ fromJSON(inputs.ghidra_versions || '["12.2", "12.1.4", "12.0.4", "11.4.3", "11.3.2"]') }}
        python-ver: ${{ fromJSON(inputs.python_versions || '["3.13", "3.12", "3.11", "3.10"]') }}
        debian-name: [bookworm, trixie]
        # JDK must satisfy application.java.min of the Ghidra release (12.2+ needs 25, older need 21; none sets a max).
        include:
          - ghidra-ver: "12.2"
            java-ver: 25
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v5

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx for multi-architecture builds
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all slim devcontainers Multi-Platform
        uses: devcontainers/ci@v0.3
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: true # added to fix https://github.com/containers/skopeo/issues/1874
          GHIDRA-BUILD-VER: ${{matrix.ghidra-ver}}
          JAVA-BUILD-VER: ${{ matrix.java-ver || 21 }}
          VARIANT: ${{matrix.python-ver}}-slim-${{matrix.debian-name}}
        with:
          configFile: .devcontainer/devcontainer-slim.json
          imageName: ghcr.io/${{ github.repository }}
          platform: linux/amd64,linux/arm64
          push: always
          imageTag: ${{matrix.ghidra-ver}}ghidra${{matrix.python-ver}}python-${{matrix.debian-name}}-slim
