name: 'build-latest'
on:
  workflow_run:
    workflows: ["build-and-push-devcontainer-all-vers"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  schedule:
    # weekly, so `latest` follows new Ghidra releases without a push to this repo
    - cron: '17 6 * * 1'

jobs:
          
   build-latest:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:        
        # platform: [linux/amd64,linux/arm64]
        # JDK for the latest Ghidra release (12.2+ requires 25); bump when application.java.min moves
        java-ver: [25]
        # pyhidra min Ghidra version 10.1.1
        ghidra-ver: ['latest']
        python-ver: ['3.13']
        debian-name: [bookworm]
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v5

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx for multi-architecture builds
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build latest devcontainer Multi-Platform
        uses: devcontainers/ci@v0.3
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: true # added to fix https://github.com/containers/skopeo/issues/1874
          GHIDRA-BUILD-VER: ${{matrix.ghidra-ver}}
          JAVA-BUILD-VER: ${{matrix.java-ver}}
          VARIANT: ${{matrix.python-ver}}-${{matrix.debian-name}}
        with:
          imageName: ghcr.io/${{ github.repository }}
          cacheFrom: ghcr.io/${{ github.repository }}
          noCache: true
          # platform: ${{matrix.platform}}
          platform: linux/amd64,linux/arm64
          push: always
          imageTag: latest        
